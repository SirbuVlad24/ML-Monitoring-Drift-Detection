name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Verify dataset exists
      run: |
        ls -la data/
        head -2 data/greenhouse_crop_yields.csv
        
    - name: Train base model (Isolation Forest)
      run: python scripts/train.py
        
    - name: Train additional models (KMeans, LinReg, RandomForest)
      run: python scripts/train_more_models.py

    - name: Generate drift simulation data
      run: python scripts/simulate_drift.py
        
    - name: Test API
      run: pytest tests/
